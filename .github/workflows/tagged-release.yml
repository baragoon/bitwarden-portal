name: tagged-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and publish for a release"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Publish tagged Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},prefix=v,value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},prefix=v,value=${{ inputs.tag }}
            type=semver,pattern={{major}},prefix=v,value=${{ inputs.tag }}
          flavor: |
            latest=auto

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Renovate rescan
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          num=$(gh issue list --state open --search "Dependency Dashboard in:title" \
                --json number --jq '.[0].number')
          [ -z "$num" ] && { echo "No dashboard issue found"; exit 0; }
          gh issue view "$num" --json body --jq .body > body.md
          if grep -q -- '- \[x\] <!-- manual job -->' body.md; then
            echo "Checkbox already ticked, a run is already requested"
            exit 0
          fi
          if ! grep -q -- '- \[ \] <!-- manual job -->' body.md; then
            echo "Manual job checkbox not found in issue #$num"
            exit 1
          fi
          sed -i 's/- \[ \] <!-- manual job -->/- [x] <!-- manual job -->/' body.md
          gh issue edit "$num" --body-file body.md
          echo "Ticked manual job checkbox on issue #$num"
